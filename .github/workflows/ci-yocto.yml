name: Yocto Production CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-yocto:
    runs-on: ubuntu-24.04

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:

      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          echo "Before cleanup:"
          df -h

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/powershell || true

          echo "After cleanup:"
          df -h

      - name: Install Host Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip python3-pexpect \
            xz-utils debianutils iputils-ping \
            python3-git python3-jinja2 \
            zstd liblz4-tool file locales \
            ca-certificates lz4 rsync \
            perl patch xterm curl

          sudo locale-gen en_US.UTF-8
          sudo update-locale LANG=en_US.UTF-8

      - name: Restore Yocto Cache
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            yocto-${{ runner.os }}-

      - name: Build Core Image Minimal
        shell: bash
        run: |
          echo "Workspace:"
          pwd

          source oe-init-build-env build

          bitbake core-image-minimal

      - name: Collect Failure Logs
        if: failure()
        run: |
          echo "===== BitBake Logs ====="

          find build -name "log.do_*" | tail -50 || true

          LOG=$(find build \
            -path "*coreutils-native*/temp/log.do_configure*" \
            | head -1)

          if [ -f "$LOG" ]; then
            echo "===== COREUTILS CONFIGURE LOG ====="
            cat "$LOG"
          fi

      - name: Upload Bootable Image Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-bootable-sdcard-image
          retention-days: 5
          path: |
            build/tmp/deploy/images/qemux86-64/*.wic*
            build/tmp/deploy/images/qemux86-64/*.ext4
            build/tmp/deploy/images/qemux86-64/bzImage*
            build/tmp/deploy/images/qemux86-64/*.qemuboot.conf
            build/tmp/deploy/images/qemux86-64/*.manifest