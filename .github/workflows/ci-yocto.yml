name: Yocto Production CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-yocto:
    runs-on: ubuntu-22.04

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gawk wget git diffstat unzip texinfo gcc build-essential \
            chrpath socat cpio python3 python3-pip \
            xz-utils debianutils iputils-ping \
            python3-git python3-jinja2 zstd liblz4-tool \
            file locales ca-certificates lz4 rsync

      - name: Build
        run: |
          source oe-init-build-env build
          bitbake core-image-minimal

      - name: Upload Bootable Image Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: yocto-bootable-sdcard-image
          retention-days: 5
          path: |
            build/tmp/deploy/images/qemux86-64/*.wic*
            build/tmp/deploy/images/qemux86-64/*.ext4
            build/tmp/deploy/images/qemux86-64/bzImage*
            build/tmp/deploy/images/qemux86-64/*.qemuboot.conf
            build/tmp/deploy/images/qemux86-64/*.manifest